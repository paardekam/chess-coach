<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #1e2024; color: #eee; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { color: #9aa0a6; font-size: 11px; margin: 0 0 12px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    input[type=number], select { width: 64px; background: #2b2e33; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
  </style>
</head>
<body>
  <h1>Bot Coach</h1>
  <p>Works on chess.com/play/computer and the analysis board only.</p>
  <label>Enabled <input id="enabled" type="checkbox"></label>
  <label>Arrows only on my turn <input id="onlyMyTurn" type="checkbox"></label>
  <label>Lines shown
    <select id="multipv"><option>1</option><option>2</option><option>3</option></select>
  </label>
  <label>Depth <input id="depth" type="number" min="6" max="24"></label>
  <script src="popup.js"></script>
</body>
</html>
